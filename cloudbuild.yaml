steps:
  # Step 1: Install uv and sync dependencies
  - name: 'python:3.11-slim'
    id: 'install-and-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install uv
        uv sync --dev
        uv run pytest tests/unit

  # Step 2: Validate Terraform IaC
  - name: 'hashicorp/terraform:latest'
    id: 'terraform-validate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd terraform
        terraform init -backend=false
        terraform validate

  # Step 3: Deploy to Vertex AI Agent Runtime
  - name: 'google/cloud-sdk:latest'
    id: 'deploy-agent-runtime'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building and deploying agent to Agent Runtime in us-east1..."
        pip install uv google-agents-cli
        agents-cli deploy --project l200-final-project-tmp-argolis --no-confirm-project

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'us-east1'
